
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Registration</h1>

    <form action="Thankyou.html" method="get">

        <input type="hidden" name="user_id" value="1001">

        <table border="1">

            <tr>
                <th colspan="2">Personal Information</th>
            </tr>

            <tr>
                <td>First Name</td>
                <td><input type="text" name="firstName"
                    pattern="[A-Za-z]+" required></td>
            </tr>

            <tr>
                <td>Last Name</td>
                <td><input type="text" name="lastName"
                    pattern="[A-Za-z]+" required></td>
            </tr>

            <tr>
                <td>Email</td>
                <td><input type="email" name="email" required></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" name="password"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                    required></td>
            </tr>

            <tr>
                <td>Repeat Password</td>
                <td><input type="password" name="repeatPassword"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                    required></td>
            </tr>

            <tr>
                <td>User Picture</td>
                <td><input type="file" name="picture" accept="image/*"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male" required> Male
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>

            <tr>
                <td>Faculty</td>
                <td>
                    <select name="faculty" required>
                        <option value="">Select Faculty</option>
                        <option>Computers and Information</option>
                        <option>Engineering</option>
                        <option>Science</option>
                        <option>Commerce</option>
                        <option>Arts</option>
                    </select>
                </td>
            </tr>

            <tr>
                <th colspan="2">Interests</th>
            </tr>

            <tr>
                <td>Interests</td>
                <td>
                    <input type="checkbox" name="interests" value="Swimming"> Swimming
                    <input type="checkbox" name="interests" value="Reading"> Reading
                    <input type="checkbox" name="interests" value="Programming"> Programming
                    <input type="checkbox" name="interests" value="Music"> Music
                </td>
            </tr>

            <tr>
                <td>About You</td>
                <td><textarea name="about" rows="4"></textarea></td>
            </tr>

            <tr>
                <th colspan="2">Additional Information</th>
            </tr>

            <tr>
                <td>Phone Number</td>
                <td>
                    <input type="tel" name="phone"
                    pattern="(010|011|012|015)[0-9]{8}" required>
                </td>
            </tr>

            <tr>
                <td>GPA</td>
                <td>
                    <input type="number" name="gpa"
                    min="0" max="4" step="0.1" required>
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td><input type="date" name="dob" required></td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox" required>
                    I agreed to the
                    <a href="terms.html" target="_blank">
                        terms and conditions
                    </a>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
